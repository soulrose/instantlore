name: Release

# ติด tag เช่น v1.2.0 แล้ว GitHub จะสร้าง InstantLore.exe ให้ และแนบไว้ในหน้า Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt pyinstaller

      - name: Build exe
        working-directory: windows
        run: pyinstaller --noconfirm --onefile --windowed --name InstantLore --collect-all rapidocr --collect-all uiautomation instantlore.py

      - name: Self-test the exe (loads OCR models and reads an image)
        working-directory: windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\InstantLore.exe -ArgumentList "--selftest", "$PWD\selftest.txt" -PassThru -Wait
          $r = Get-Content selftest.txt -Raw
          Write-Host "selftest: $r"
          if ($r -ne "ok") { exit 1 }

      - name: Rename
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Copy-Item windows\dist\InstantLore.exe "InstantLore-$v-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: InstantLore-windows
          path: InstantLore-*-windows-x64.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "InstantLore $tag" --generate-notes }
          gh release upload $tag (Get-ChildItem InstantLore-*-windows-x64.exe).FullName --clobber
